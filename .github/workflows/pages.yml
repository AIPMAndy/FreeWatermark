name: Test and deploy FreeWatermark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: freewatermark-pages
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install Python test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Browser regression (mobile viewport, export and ZIP)
        run: python3 tests/browser_smoke.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p dist/src dist/assets
          cp index.html styles.css favicon.svg manifest.webmanifest sw.js og-cover.svg dist/
          cp assets/social-preview.png dist/assets/
          cp src/*.js dist/src/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
